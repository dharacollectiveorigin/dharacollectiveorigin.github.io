<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DHARA | Admin</title><style>body{font:15px Arial;background:#f4f3ef;color:#222;margin:0}header{background:#181818;color:white;padding:22px 5%;display:flex;justify-content:space-between}main{max-width:1050px;margin:auto;padding:25px}section{background:white;padding:22px;margin:20px 0;border:1px solid #ddd}input,textarea,button{padding:11px;margin:5px 0;font:inherit}input,textarea{width:100%;box-sizing:border-box;border:1px solid #ccc}button{background:#222;color:white;border:0;cursor:pointer}button.secondary{background:#777}article{border-top:1px solid #ddd;padding:15px 0}#messages{height:280px;overflow:auto;border:1px solid #ddd;padding:10px}small{color:#777}#dashboard{display:none}</style><link rel="stylesheet" href="./admin-responsive.css"><header><strong>DHARA / ADMIN</strong><a href="index.html" style="color:white">View store</a></header><main><section id="login"><h2>Admin sign in</h2><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button id="signin">Sign in</button><p id="loginstatus"></p></section><div id="dashboard"><button id="signout">Sign out</button><section><h2>Products</h2><form id="productform"><input id="pid" type="hidden"><label>Name<input id="name" required maxlength="120"></label><label>Price (BDT)<input id="price" type="number" min="0" step="1" required></label><label>Discount (%)<input id="discount" type="number" min="0" max="100" value="0" required></label><label>Image URL (https)<input id="image" type="url" placeholder="https://..."></label><label>Sizes (comma-separated)<input id="sizes" placeholder="S,M,L,XL"></label><label>Stock quantity<input id="stock" type="number" min="0" value="0"></label><label>Description<textarea id="description" maxlength="2000"></textarea></label><label><input id="active" type="checkbox" checked style="width:auto"> Visible in store</label><p><button>Save product</button> <button type="reset" class="secondary" id="reset">Clear</button></p></form><div id="productlist"></div></section><section><h2>Social media settings</h2><p><small>Add or update your social links. Leave a field blank to hide that icon.</small></p><form id="socialform"><label>Facebook URL<input id="social-facebook" type="url" placeholder="https://facebook.com/..."></label><label>Instagram URL<input id="social-instagram" type="url" placeholder="https://instagram.com/..."></label><label>YouTube URL<input id="social-youtube" type="url" placeholder="https://youtube.com/@..."></label><label>TikTok URL<input id="social-tiktok" type="url" placeholder="https://www.tiktok.com/@..."></label><button type="submit">Save social links</button><p id="socialstatus" role="status"></p></form></section><section><h2>Customer messages</h2><p><small>Choose a conversation to reply on the website. WhatsApp two-way sync is not included.</small></p><div id="conversations"></div><h3 id="chatheading">Select a conversation</h3><div id="messages"></div><form id="replyform"><input id="reply" placeholder="Reply to customer" maxlength="1000" required><button>Send reply</button></form></section></div></main><script type="module" src="admin.js"></script></html>
